image: ubuntu/22.04
packages:
  - git
  - build-essential
  - ninja-build
  - pkgconf
  - scdoc
  - llvm
  - lld
  - clang
  - clang-tidy
  - clang-format
  - cloc
  - python3
  - python3-pip
  - python3-dev

sources:
  - https://git.sr.ht/~alecgraves/mirage
  - https://git.sr.ht/~alecgraves/quicksand
  - https://git.sr.ht/~alecgraves/ros3

tasks:
  - setup: |
      # mirage
      make -j$(nproc) -C mirage all docs
      make -C mirage check
      sudo make -C mirage install install-docs
      make -C mirage python

      # quicksand
      make -j$(nproc) -C quicksand all docs
      make -C quicksand check
      sudo make -C quicksand install install-docs
      make -C quicksand python

      # fix llvm14 aslr bug with newer kernels (https://github.com/actions/runner/issues/3481)
      sudo sysctl vm.mmap_rnd_bits=28

  - build: |
      cd ros3
      make -j"$(nproc)"
      make docs
      sudo make install
      sudo make install-docs
      sudo ldconfig
      make python

  - test: |
      cd ros3
      make check
      make check-python
