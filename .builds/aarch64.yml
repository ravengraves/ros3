image: debian/stable
arch: arm64

sources:
  - https://git.sr.ht/~alecgraves/mirage
  - https://git.sr.ht/~alecgraves/quicksand
  - https://git.sr.ht/~alecgraves/ros3

tasks:
  - packages: |
      echo '* libraries/restart-without-asking boolean true' | sudo debconf-set-selections
      gpg --keyserver keyserver.ubuntu.com --recv-keys 78DBA3BC47EF2265
      gpg --export --armor 78DBA3BC47EF2265 | sudo tee /etc/apt/trusted.gpg.d/debupdate.asc > /dev/null
      sudo apt-get update
      sudo DEBIAN_FRONTEND=noninteractive apt-get -yq --no-install-recommends install \
        git build-essential ninja-build \
        pkgconf scdoc \
        llvm lld clang libclang-rt-dev clang-tidy clang-format \
        cloc \
        python3-pip python3-dev

  - setup: |
      # mirage
      make -j"$(nproc)" -C mirage all docs
      sudo make -C mirage install install-docs
      make -C mirage python

      # quicksand
      make -j"$(nproc)" -C quicksand all docs
      sudo make -C quicksand install install-docs
      make -C quicksand python

  - build: |
      cd ros3
      make -j"$(nproc)"
      make docs
      sudo make install
      sudo make install-docs
      sudo ldconfig
      make python

  - test: |
      cd ros3
      make sanitize-check
      make check-python
